# Claude Dock's identity, shared by rebrand.sh, seed-prefs.py and install.sh (KEY=value, no spaces
# around =). zach/swap-on-quit/main.swift and hammerspoon/claude-dock.lua repeat the app path, the
# executable and the bundle id: change them there too.
APP_NAME="Claude Dock"
BUNDLE_ID=com.zakkbates.claudedock
EXECUTABLE=ClaudeDock
# The settings suite (main.m reads it from Info.plist key ZachForkSettingsSuite): defaults domain
# ~/Library/Preferences/ClaudeDock.plist, ~/Library/Application Support/ClaudeDock,
# ~/.config/ClaudeDock, sockets named ClaudeDock.socket.*. Letters and digits only (no space: the
# config folder is the space-free path scripts use).
SUITE=ClaudeDock
INSTALLED_APP="/Applications/Claude Dock.app"
